<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta
            name="viewport"
            content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
        />
        <title>zach brill com</title>
        <style>
            * {
                margin: 0;
                padding: 0;
                box-sizing: border-box;
            }

            body {
                font-family: "Georgia", serif;
                color: #333;
                background: #fff;
                touch-action: manipulation;
            }

            header {
                padding: 2rem;
            }

            h1 {
                font-size: 1.2rem;
                font-weight: 400;
                letter-spacing: 1px;
                margin-bottom: 1rem;
            }

            nav a {
                margin-right: 1.5rem;
                color: #999;
                text-decoration: none;
                font-size: 0.85rem;
                cursor: pointer;
            }

            nav a.active {
                color: #000;
            }

            @media (max-width: 768px) {
                header {
                    padding: 1.5rem;
                }

                h1 {
                    font-size: 1rem;
                }

                nav a {
                    font-size: 0.8rem;
                    margin-right: 1rem;
                }
            }

            .project-view {
                display: none;
                padding: 2rem;
            }

            .project-view.active {
                display: block;
            }

            @media (max-width: 768px) {
                .project-view {
                    padding: 1rem;
                }
            }

            .image-viewer {
                position: relative;
            }

            .image-container {
                width: 50%;
                height: 80vh;
                display: flex;
                align-items: center;
                padding-bottom: 4rem;
            }

            .image-container img {
                max-width: 100%;
                max-height: 100%;
                object-fit: contain;
            }

            .image-placeholder {
                color: #ccc;
                font-size: 0.85rem;
                padding-left: 2rem;
            }

            @media (max-width: 768px) {
                .image-container {
                    width: 100%;
                    height: 70vh;
                    justify-content: center;
                }
            }

            .arrow {
                position: fixed;
                bottom: 5%;
                background: none;
                border: none;
                font-size: 1rem;
                color: black;
                cursor: pointer;
                padding: 1rem;
                transition: color 0.3s;
                -webkit-tap-highlight-color: transparent;
            }

            .arrow:hover:not(:disabled) {
                color: #000;
            }

            .arrow:active:not(:disabled) {
                color: #000;
            }

            .arrow:disabled {
                opacity: 0.2;
                cursor: not-allowed;
            }

            .arrow.prev {
                left: 1rem;
            }

            .arrow.next {
                right: 1rem;
            }

            .counter {
                position: fixed;
                bottom: 2rem;
                right: 2rem;
                font-size: 0.75rem;
            }

            @media (max-width: 768px) {
                .counter {
                    bottom: 1rem;
                    right: 1rem;
                    font-size: 0.7rem;
                }
            }

            .demo-player {
                max-width: 340px;
                padding-top: 1rem;
            }

            .demo-art {
                width: 100%;
                aspect-ratio: 1;
                object-fit: cover;
                display: block;
                margin-bottom: 1rem;
            }

            .demo-meta {
                margin-bottom: 0.75rem;
            }

            .demo-title {
                display: block;
                font-size: 0.9rem;
                color: #333;
            }

            .demo-artist {
                display: block;
                font-size: 0.8rem;
                color: #999;
                margin-top: 2px;
            }

            .demo-progress {
                width: 100%;
                margin-bottom: 1rem;
                accent-color: #333;
            }

            .demo-controls {
                display: flex;
                gap: 1.5rem;
                margin-bottom: 1.5rem;
            }

            .demo-btn {
                background: none;
                border: none;
                font-size: 1rem;
                cursor: pointer;
                padding: 0;
                color: #333;
            }

            .demo-tracklist {
                border-top: 1px solid #eee;
                padding-top: 0.5rem;
            }

            .demo-track {
                display: flex;
                align-items: center;
                gap: 1rem;
                padding: 0.5rem 0;
                cursor: pointer;
                border-bottom: 1px solid #f5f5f5;
            }

            .demo-track.amplitude-active-song-container .demo-track-name {
                color: #000;
            }

            .demo-track-num {
                font-size: 0.75rem;
                color: #ccc;
                width: 1rem;
                text-align: right;
            }

            .demo-track-name {
                font-size: 0.85rem;
                color: #999;
            }
        </style>
    </head>
    <body>
        <header>
            <h1>you are here</h1>
            <nav>
                <a class="project-link active" data-project="sauvie"
                    >untitled (sauvie)</a
                >
                <a class="project-link" data-project="desert"
                    >untitled (desert)</a
                >
                <a class="project-link" data-project="music">music</a>
            </nav>
        </header>

        <div class="project-view active" id="sauvie">
            <div class="image-viewer">
                <div class="image-container"></div>
            </div>
        </div>

        <div class="project-view" id="desert">
            <div class="image-viewer">
                <div class="image-container"></div>
            </div>
        </div>

        <div class="project-view" id="music"></div>
        <div class="project-view" id="demo"></div>

        <button class="arrow prev">←</button>
        <button class="arrow next">→</button>
        <div class="counter"></div>

        <script>
            const projects = {
                sauvie: {
                    type: "images",
                    images: [
                        "./img/sauvie/IMG_3886.jpg",
                        "./img/sauvie/IMG_3640.jpg",
                        "./img/sauvie/IMG_3897.jpg",
                        "./img/sauvie/IMG_3860.jpg",
                        "./img/sauvie/IMG_3876.jpg",
                        "./img/sauvie/IMG_3846.jpg",
                        "./img/sauvie/IMG_3746.jpg",
                        "./img/sauvie/IMG_3881.jpg",
                        "./img/sauvie/IMG_3211.jpg",
                        "./img/sauvie/IMG_3906.jpg",
                        "./img/sauvie/IMG_3875.jpg",
                        "./img/sauvie/IMG_3892.jpg",
                        "./img/sauvie/IMG_3883.jpg",
                        "./img/sauvie/IMG_3334-2.jpg",
                    ],
                    current: 0,
                    music: false,
                },
                desert: {
                    type: "images",
                    images: [
                        "./img/desert/IMG_3920.jpg",
                        "./img/desert/IMG_3927.jpg",
                        "./img/desert/IMG_3918.jpg",
                        "./img/desert/IMG_2538.jpg",
                        "./img/desert/IMG_2566.jpg",
                        "./img/desert/IMG_3964.jpg",
                    ],
                    current: 0,
                    music: false,
                },
                music: {
                    type: "music",
                    images: [],
                    current: 0,
                },
                demo: { type: "player" },
            };

            let activeProject = "sauvie";

            const prevArrow = document.querySelector(".arrow.prev");
            const nextArrow = document.querySelector(".arrow.next");
            const counter = document.querySelector(".counter");

            function initPlayer() {
                const container = document.querySelector("#demo");
                if (container.dataset.initialized) return;
                container.dataset.initialized = true;

                container.innerHTML = `
                    <div class="demo-player">
                        <img amplitude-song-info="cover_art_url" class="demo-art" />
                        <div class="demo-meta">
                            <span class="demo-title" amplitude-song-info="name"></span>
                            <span class="demo-artist" amplitude-song-info="artist"></span>
                        </div>
                        <input type="range" class="demo-progress amplitude-song-played-progress" amplitude-main-song-played-progress />
                        <div class="demo-controls">
                            <button amplitude-main-prev class="demo-btn">←</button>
                            <button amplitude-main-play-pause class="demo-btn demo-play">▶</button>
                            <button amplitude-main-next class="demo-btn">→</button>
                        </div>
                        <div class="demo-tracklist" id="demo-tracklist"></div>
                    </div>
                `;

                Amplitude.init({
                    songs: [
                        {
                            name: "1",
                            artist: "chits",
                            url: "./music/demo/91_2.mp3",
                            cover_art_url: "./img/demo-cover.jpg",
                        },
                        {
                            name: "2",
                            artist: "chits",
                            url: "./music/demo/157_1.mp3",
                            cover_art_url: "./img/demo-cover.jpg",
                        },
                        {
                            name: "3",
                            artist: "chits",
                            url: "./music/demo/134_5.mp3",
                            cover_art_url: "./img/demo-cover.jpg",
                        },
                        {
                            name: "is now so bad",
                            artist: "chits",
                            url: "./music/demo/148_demo.mp3",
                            cover_art_url: "./img/demo-cover.jpg",
                        },
                        {
                            name: "5",
                            artist: "chits",
                            url: "./music/demo/136_3.mp3",
                            cover_art_url: "./img/demo-cover.jpg",
                        },
                        {
                            name: "6",
                            artist: "chits",
                            url: "./music/demo/151_2.mp3",
                            cover_art_url: "./img/demo-cover.jpg",
                        },
                        {
                            name: "no",
                            artist: "chits",
                            url: "./music/demo/3726.mp3",
                            cover_art_url: "./img/demo-cover.jpg",
                        },
                    ],
                    callbacks: {
                        initialized: buildTracklist,
                    },
                });
            }

            function buildTracklist() {
                const list = document.getElementById("demo-tracklist");
                Amplitude.getSongs().forEach((song, i) => {
                    const row = document.createElement("div");
                    row.className =
                        "demo-track amplitude-song-container amplitude-play-pause";
                    row.setAttribute("amplitude-song-index", i);
                    row.innerHTML = `<span class="demo-track-num">${i + 1}</span><span class="demo-track-name">${song.name}</span>`;
                    list.appendChild(row);
                });
            }

            function updateUI() {
                const project = projects[activeProject];

                if (project.type === "music") {
                    prevArrow.style.display = "none";
                    nextArrow.style.display = "none";
                    counter.textContent = "";
                    const container = document.querySelector("#music");
                    if (!container.querySelector("iframe")) {
                        const iframe = document.createElement("iframe");
                        iframe.style.cssText =
                            "border: 0; width: 350px; height: 786px;";
                        iframe.src =
                            "https://bandcamp.com/EmbeddedPlayer/album=707130495/size=large/bgcol=ffffff/linkcol=0687f5/transparent=true/";
                        iframe.setAttribute("seamless", "");
                        container.appendChild(iframe);
                        iframe.innerHTML =
                            '<a href="https://chits.bandcamp.com/album/kind-man">Kind Man by chits</a>';
                    }
                } else if (project.type === "player") {
                    prevArrow.style.display = "none";
                    nextArrow.style.display = "none";
                    counter.textContent = "";
                    initPlayer();
                } else {
                    prevArrow.style.display = "";
                    nextArrow.style.display = "";
                    const container = document.querySelector(
                        `#${activeProject} .image-container`,
                    );
                    const img = container.querySelector("img");
                    img.src = project.images[project.current];
                    img.alt = `Image ${project.current + 1}`;
                    counter.textContent = `${project.current + 1} / ${project.images.length}`;
                    prevArrow.disabled = project.current === 0;
                    nextArrow.disabled =
                        project.current === project.images.length - 1;
                }
            }

            function navigate(direction) {
                const project = projects[activeProject];
                if (
                    direction === "next" &&
                    project.current < project.images.length - 1
                ) {
                    project.current++;
                } else if (direction === "prev" && project.current > 0) {
                    project.current--;
                }
                updateUI();

                const { images, current } = project;
                [current - 1, current + 1].forEach((i) => {
                    if (images[i]) new Image().src = images[i];
                });
            }

            function activateProject(projectId) {
                if (!projects[projectId]) projectId = "sauvie";

                document
                    .querySelectorAll(".project-view")
                    .forEach((p) => p.classList.remove("active"));
                document
                    .querySelectorAll(".project-link")
                    .forEach((l) => l.classList.remove("active"));

                document.getElementById(projectId).classList.add("active");
                document
                    .querySelector(`[data-project="${projectId}"]`)
                    .classList.add("active");

                activeProject = projectId;
                updateUI();
            }

            window.addEventListener("hashchange", () => {
                activateProject(location.hash.slice(1));
            });

            document.querySelectorAll(".project-link").forEach((link) => {
                link.addEventListener("click", (e) => {
                    e.preventDefault();
                    location.hash = link.dataset.project;
                });
            });

            prevArrow.addEventListener("click", () => navigate("prev"));
            nextArrow.addEventListener("click", () => navigate("next"));

            document.addEventListener("keydown", (e) => {
                if (e.key === "ArrowRight") navigate("next");
                else if (e.key === "ArrowLeft") navigate("prev");
            });

            // Init — pre-create img elements
            Object.entries(projects).forEach(([id, project]) => {
                if (!project.music) {
                    const container = document.querySelector(
                        `#${id} .image-container`,
                    );
                    const img = document.createElement("img");
                    img.alt = "";
                    container.appendChild(img);
                }
            });

            activateProject(location.hash.slice(1) || "sauvie");
        </script>
        <script src="https://cdn.jsdelivr.net/npm/amplitudejs@5.3.2/dist/amplitude.js"></script>
    </body>
</html>
